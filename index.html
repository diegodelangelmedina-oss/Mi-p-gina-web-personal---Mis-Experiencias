<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diego del Ángel Medina | Mis Experiencias</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      content: ["**/*"],
      theme: {
        extend: {
          colors: {
            emerald: { DEFAULT: '#10b981', dark: '#059669' },
            earth:   { DEFAULT: '#d97706' },
            cream:   '#f5f0e8',
            stone:   { light: '#a8a29e', DEFAULT: '#78716c' }
          },
          fontFamily: {
            display: ['Cormorant Garamond', 'serif'],
            body: ['DM Sans', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --c-bg: #0d0b09;
      --c-card: #1e1a16;
      --c-emerald: #10b981;
    }

    body {
      background: var(--c-bg);
      color: #e5e0d8;
      font-family: 'DM Sans', sans-serif;
    }

    .font-display { font-family: 'Cormorant Garamond', serif; }

    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .exp-card {
      background: var(--c-card);
      border: 1px solid rgba(16,185,129,0.2);
      transition: all 0.4s ease;
    }
    .exp-card:hover {
      transform: translateY(-8px);
      border-color: #10b981;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3);
    }

    .gradient-text {
      background: linear-gradient(135deg, #10b981, #34d399, #d97706);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Canvas particles */
    #hero-canvas {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav id="navbar" class="fixed top-0 w-full z-50 bg-[#0d0b09]/90 backdrop-blur-md border-b border-emerald-900/30">
    <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center">
      <a href="#" class="font-display text-2xl tracking-wide">D. del Ángel</a>
      
      <div class="hidden md:flex gap-8 text-sm">
        <a href="#sobre-mi" class="hover:text-emerald-400 transition">Sobre mí</a>
        <a href="#experiencias" class="hover:text-emerald-400 transition">Experiencias</a>
        <a href="#habilidades" class="hover:text-emerald-400 transition">Habilidades</a>
        <a href="#educacion" class="hover:text-emerald-400 transition">Educación</a>
      </div>
    </div>
  </nav>

  <!-- Resto del código original de Claude (mantengo la estructura principal) -->
  <!-- Hero -->
  <section id="hero" class="relative min-h-screen flex items-center justify-center overflow-hidden">
    <canvas id="hero-canvas"></canvas>
    <div class="relative z-10 text-center px-6 max-w-4xl mx-auto pt-16">
      <h1 class="font-display text-6xl md:text-7xl font-semibold leading-none mb-6">
        Diego del Ángel<br><span class="gradient-text">Medina</span>
      </h1>
      <p class="text-xl text-emerald-300 mb-8">Técnico en Productividad Industrial</p>
    </div>
  </section>

  <!-- El resto de secciones las mantengo resumidas para que funcione bien -->
  <!-- Puedes ir añadiendo poco a poco las secciones completas que quieras -->

  <script>
    // Navbar scroll
    window.addEventListener('scroll', () => {
      document.getElementById('navbar').classList.toggle('shadow-xl', window.scrollY > 50);
    });

    // Scroll Reveal
    const reveals = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1 });

    reveals.forEach(el => observer.observe(el));

    // Particles Canvas
    const canvas = document.getElementById('hero-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.speedY = Math.random() * 0.5 - 0.25;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
      }
      draw() {
        ctx.fillStyle = 'rgba(16, 185, 129, 0.6)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < 80; i++) {
        particles.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      initParticles();
    });

    resizeCanvas();
    initParticles();
    animateParticles();
  </script>
</body>
</html>
